[package]
name = "grabout-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "grabout_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
clipboard-win = "4.5"
winapi = { version = "0.3", features = ["consoleapi", "um"] }
x11-clipboard = "0.7" 